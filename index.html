<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HALLO MY OSHI - Mini Game Idol</title>
  
  <!-- 1. IMPORT GOOGLE FONT POPPINS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       VARIABEL WARNA & TEMA TEATER IDOL MEWAH
       ========================================================================== */
    :root {
      --bg-dark: #070714;
      --theater-red: #1a0814;
      --neon-pink: #ff2a85;
      --neon-pink-glow: rgba(255, 42, 133, 0.6);
      --neon-blue: #00f0ff;
      --neon-blue-glow: rgba(0, 240, 255, 0.5);
      --gold-accent: #ffd700;
      --glass-bg: rgba(18, 18, 38, 0.65);
      --glass-border: rgba(255, 255, 255, 0.15);
      --text-main: #ffffff;
      --text-sub: #b3b9d1;
    }

    /* ==========================================================================
       RESET & DASAR
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at 50% 20%, #200b2b 0%, var(--bg-dark) 80%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Kursor Lightstick Kustom (SVG Data URI) */
    body, button, .custom-upload, .podium {
      cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 24 24'><path fill='%23ff2a85' d='M14.5 2.5l7 7l-3.5 3.5l-7-7z'/><path fill='%2300f0ff' d='M10.5 6.5l7 7l-1.5 1.5l-7-7z'/><path fill='%23ffffff' d='M8 9l7 7l-5.5 5.5a2.121 2.121 0 0 1-3-3L8 9z'/><circle cx='18' cy='6' r='3' fill='%23ffd700'/></svg>") 4 4, auto;
    }

    body:active, button:active, .podium:active {
      cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 24 24'><path fill='%2300f0ff' d='M14.5 2.5l7 7l-3.5 3.5l-7-7z'/><path fill='%23ff2a85' d='M8 9l7 7l-5.5 5.5a2.121 2.121 0 0 1-3-3L8 9z'/><circle cx='18' cy='6' r='5' fill='%23ff2a85'/></svg>") 4 4, auto;
    }

    /* Efek Spotlight Panggung Latar Belakang */
    .spotlight {
      position: fixed;
      top: -20%;
      width: 300px;
      height: 1000px;
      pointer-events: none;
      opacity: 0.15;
      filter: blur(50px);
      z-index: 0;
      transform-origin: top center;
    }
    .spotlight-left {
      left: 10%;
      background: linear-gradient(180deg, var(--neon-pink), transparent);
      animation: swing 6s ease-in-out infinite alternate;
    }
    .spotlight-right {
      right: 10%;
      background: linear-gradient(180deg, var(--neon-blue), transparent);
      animation: swing 6s ease-in-out infinite alternate-reverse;
    }

    @keyframes swing {
      0% { transform: rotate(-20deg); }
      100% { transform: rotate(20deg); }
    }

    /* Container Layar Utama */
    .app-container {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      position: relative;
      z-index: 1;
    }

    /* Sistem Transisi Antar Layar */
    .screen {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .screen.active {
      display: flex;
      opacity: 1;
      transform: scale(1);
    }

    /* Efek Glassmorphism Reusable */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 15px rgba(255, 42, 133, 0.1);
      width: 100%;
      padding: 1.75rem;
    }

    /* ==========================================================================
       LAYAR 1: INTRO & UPLOAD PANEL
       ========================================================================== */
    .game-title {
      font-size: 2.2rem;
      font-weight: 900;
      text-align: center;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #fff 20%, var(--neon-pink) 60%, var(--neon-blue) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px var(--neon-pink-glow);
      margin-bottom: 0.3rem;
    }

    .game-subtitle {
      font-size: 0.85rem;
      color: var(--neon-blue);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      text-shadow: 0 0 10px var(--neon-blue-glow);
    }

    .poster-preview {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      margin: 0 auto 1.25rem;
      border: 3px solid var(--neon-pink);
      box-shadow: 0 0 20px var(--neon-pink-glow);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      position: relative;
    }
    .poster-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .upload-group {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin-bottom: 1.5rem;
      width: 100%;
    }

    .custom-upload {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed rgba(255, 255, 255, 0.25);
      padding: 0.75rem 1rem;
      border-radius: 14px;
      transition: all 0.3s ease;
    }
    .custom-upload:hover {
      background: rgba(255, 42, 133, 0.08);
      border-color: var(--neon-pink);
      box-shadow: 0 0 10px rgba(255, 42, 133, 0.2);
    }
    .custom-upload input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      cursor: inherit;
    }
    .upload-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-sub);
    }
    .file-status {
      font-size: 0.75rem;
      color: var(--neon-blue);
      max-width: 150px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Tombol Utama Pill-Shape */
    .btn-glow {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, var(--neon-pink), #a00050);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      box-shadow: 0 0 25px var(--neon-pink-glow);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .btn-glow:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 35px var(--neon-pink);
    }
    .btn-glow:active {
      transform: translateY(1px);
    }

    /* ==========================================================================
       LAYAR 2: GAMEPLAY (HEADER & 3x3 ARENA)
       ========================================================================== */
    .gameplay-header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 1.25rem;
    }
    .stat-badge {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 0.6rem 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 120px;
    }
    .stat-badge.timer {
      border-color: rgba(0, 240, 255, 0.4);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
    }
    .stat-badge.score {
      border-color: rgba(255, 42, 133, 0.4);
      box-shadow: 0 0 15px rgba(255, 42, 133, 0.15);
    }
    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-sub);
    }
    .stat-value {
      font-size: 1.8rem;
      font-weight: 900;
      line-height: 1.1;
    }
    .timer .stat-value { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue-glow); }
    .score .stat-value { color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink-glow); }

    /* Grid Panggung 3x3 */
    .stage-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      aspect-ratio: 1 / 1;
      padding: 12px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .podium-hole {
      position: relative;
      background: radial-gradient(circle, #101026 50%, #05050e 100%);
      border-radius: 18px;
      overflow: hidden;
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 8px 12px rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    /* Karakter Oshi (Muncul Dari Bawah) */
    .oshi-target {
      width: 82%;
      height: 82%;
      position: absolute;
      bottom: 0;
      transform: translateY(115%);
      transition: transform 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      justify-content: center;
      align-items: center;
      will-change: transform;
    }

    .oshi-target.up {
      transform: translateY(0%);
    }

    .oshi-target img, .oshi-target .avatar-fallback {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--neon-pink);
      box-shadow: 0 0 15px var(--neon-pink-glow);
      pointer-events: all;
    }

    .avatar-fallback {
      background: linear-gradient(135deg, #3a1c4d, #140924);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
    }

    /* Efek Pop Teks Nilai (+10 Chant) */
    .hit-sparkle {
      position: absolute;
      top: 20%;
      font-weight: 900;
      font-size: 1.4rem;
      color: var(--gold-accent);
      text-shadow: 0 0 8px #ffaa00;
      animation: floatUp 0.6s ease-out forwards;
      pointer-events: none;
      z-index: 10;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-35px) scale(1.3); }
    }

    /* ==========================================================================
       LAYAR 3: GAME OVER POP-UP MODAL
       ========================================================================== */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(12px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 99;
      padding: 1.5rem;
    }
    .modal-overlay.active {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      text-align: center;
      max-width: 400px;
    }
    .modal-title {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--neon-blue);
      text-shadow: 0 0 15px var(--neon-blue-glow);
      margin-bottom: 0.2rem;
    }
    .modal-rank {
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: var(--neon-pink);
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    .final-score-box {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      border: 1px solid var(--glass-border);
    }
    .final-score-box span {
      display: block;
      font-size: 0.8rem;
      color: var(--text-sub);
    }
    .final-score-box strong {
      font-size: 3rem;
      font-weight: 900;
      color: var(--gold-accent);
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
    }

    /* RESPONSIVE KHUSUS LAYAR KECIL */
    @media (max-width: 380px) {
      .game-title { font-size: 1.8rem; }
      .stat-value { font-size: 1.4rem; }
      .stage-grid { gap: 8px; padding: 8px; }
    }
  </style>
</head>
<body>

  <!-- Efek Spotlight Panggung -->
  <div class="spotlight spotlight-left"></div>
  <div class="spotlight spotlight-right"></div>

  <div class="app-container">

    <!-- ==========================================================================
         1. LAYAR INTRO / UPLOAD
         ========================================================================== -->
    <section id="screenIntro" class="screen active">
      <h1 class="game-title">HALLO MY OSHI</h1>
      <p class="game-subtitle">Teater Chant Rhythm & Tap</p>

      <div class="glass-card">
        <!-- Poster / Preview Oshi -->
        <div class="poster-preview" id="posterPreview">
          <div class="avatar-fallback" id="previewPlaceholder">✨</div>
          <img id="previewImg" src="" alt="Oshi Preview" style="display: none;" />
        </div>

        <!-- Panel Upload Estetik -->
        <div class="upload-group">
          <!-- Upload Foto -->
          <div class="custom-upload">
            <input type="file" id="uploadPhoto" accept="image/*" />
            <span class="upload-label">📸 Foto Oshi</span>
            <span class="file-status" id="photoStatus">Default Idol</span>
          </div>

          <!-- Upload BGM -->
          <div class="custom-upload">
            <input type="file" id="uploadBgm" accept="audio/*" />
            <span class="upload-label">🎵 BGM Musik</span>
            <span class="file-status" id="bgmStatus">Default Beat</span>
          </div>

          <!-- Upload Voice Line -->
          <div class="custom-upload">
            <input type="file" id="uploadVoice" accept="audio/*" />
            <span class="upload-label">🗣️ Suara Chant</span>
            <span class="file-status" id="voiceStatus">Default Kyun</span>
          </div>
        </div>

        <button id="btnStart" class="btn-glow">Mulai Chant! 🪄</button>
      </div>
    </section>

    <!-- ==========================================================================
         2. LAYAR GAMEPLAY (ARENA 3x3)
         ========================================================================== -->
    <section id="screenGameplay" class="screen">
      <div class="gameplay-header">
        <div class="stat-badge timer">
          <span class="stat-label">Sisa Waktu</span>
          <span id="txtTimer" class="stat-value">30</span>
        </div>
        <div class="stat-badge score">
          <span class="stat-label">Total Skor</span>
          <span id="txtScore" class="stat-value">0</span>
        </div>
      </div>

      <!-- Arena Grid 3x3 -->
      <div class="stage-grid" id="stageGrid">
        <!-- 9 Lubang Panggung di-generate otomatis via JS -->
      </div>
    </section>

  </div>

  <!-- ==========================================================================
       3. MODAL GAME OVER (OTSUKARE)
       ========================================================================== -->
  <div id="modalGameOver" class="modal-overlay">
    <div class="glass-card modal-content">
      <h2 class="modal-title">OTSUKARE!</h2>
      <p id="txtRank" class="modal-rank">Fans Garis Keras</p>

      <div class="final-score-box">
        <span>TOTAL SKOR KAMU</span>
        <strong id="txtFinalScore">0</strong>
      </div>

      <button id="btnRestart" class="btn-glow">Main Lagi 🔄</button>
    </div>
  </div>

  <!-- ==========================================================================
       AUDIO ELEMEN & LOGIKA JAVASCRIPT
       ========================================================================== -->
  <audio id="bgmPlayer" loop preload="auto"></audio>
  <audio id="sfxPlayer" preload="auto"></audio>

  <script>
    /* ==========================================================================
       STATE & VARIABEL GLOBAL GAME
       ========================================================================== */
    let score = 0;
    let timeLeft = 30;
    let isPlaying = false;
    let gameTimer = null;
    let spawnTimer = null;
    let activeHoles = new Set(); // Mencegah oshi muncul di lubang yang sama

    // Asset Data (Menggunakan ObjectURL atau Fallback)
    let oshiPhotoUrl = null;
    let bgmUrl = null;
    let sfxUrl = null;

    // Elemen DOM
    const screenIntro = document.getElementById('screenIntro');
    const screenGameplay = document.getElementById('screenGameplay');
    const modalGameOver = document.getElementById('modalGameOver');
    
    const btnStart = document.getElementById('btnStart');
    const btnRestart = document.getElementById('btnRestart');
    
    const txtTimer = document.getElementById('txtTimer');
    const txtScore = document.getElementById('txtScore');
    const txtFinalScore = document.getElementById('txtFinalScore');
    const txtRank = document.getElementById('txtRank');

    const uploadPhoto = document.getElementById('uploadPhoto');
    const uploadBgm = document.getElementById('uploadBgm');
    const uploadVoice = document.getElementById('uploadVoice');

    const photoStatus = document.getElementById('photoStatus');
    const bgmStatus = document.getElementById('bgmStatus');
    const voiceStatus = document.getElementById('voiceStatus');

    const previewImg = document.getElementById('previewImg');
    const previewPlaceholder = document.getElementById('previewPlaceholder');

    const bgmPlayer = document.getElementById('bgmPlayer');
    const sfxPlayer = document.getElementById('sfxPlayer');
    const stageGrid = document.getElementById('stageGrid');

    /* ==========================================================================
       AUDIO SYNTHESIZER FALLBACK (Web Audio API)
       Jika pemain tidak upload lagu/suara, game tetap punya audio futuristik!
       ========================================================================== */
    let audioCtx = null;

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    // Suara Chant "Kyun!" saat memukul oshi (Fallback SFX)
    function playFallbackHitSFX() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
        osc.frequency.exponentialRampToValueAtTime(1174.66, audioCtx.currentTime + 0.12); // D6
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch (e) {
        console.warn(e);
      }
    }

    // Nada Ringan BGM Mini (Fallback BGM)
    let fallbackBgmInterval = null;
    function startFallbackBgm() {
      if (!audioCtx) return;
      const notes = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5
      let step = 0;
      fallbackBgmInterval = setInterval(() => {
        if (!isPlaying) return;
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = notes[step % notes.length];
          gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.35);
          step++;
        } catch(e) {}
      }, 350);
    }

    function stopFallbackBgm() {
      if (fallbackBgmInterval) {
        clearInterval(fallbackBgmInterval);
        fallbackBgmInterval = null;
      }
    }

    /* ==========================================================================
       MANAJEMEN FILE UPLOAD (URL.createObjectURL)
       ========================================================================== */
    uploadPhoto.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        oshiPhotoUrl = URL.createObjectURL(file);
        previewImg.src = oshiPhotoUrl;
        previewImg.style.display = 'block';
        previewPlaceholder.style.display = 'none';
        photoStatus.textContent = file.name;
      }
    });

    uploadBgm.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        bgmUrl = URL.createObjectURL(file);
        bgmPlayer.src = bgmUrl;
        bgmStatus.textContent = file.name;
      }
    });

    uploadVoice.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        sfxUrl = URL.createObjectURL(file);
        sfxPlayer.src = sfxUrl;
        voiceStatus.textContent = file.name;
      }
    });

    /* ==========================================================================
       INISIALISASI ARENA GRID 3x3
       ========================================================================== */
    function buildGrid() {
      stageGrid.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        const hole = document.createElement('div');
        hole.className = 'podium-hole';
        hole.dataset.index = i;

        // Container Karakter Oshi
        const oshi = document.createElement('div');
        oshi.className = 'oshi-target';

        // Tampilan Foto atau Avatar Fallback
        if (oshiPhotoUrl) {
          const img = document.createElement('img');
          img.src = oshiPhotoUrl;
          img.alt = "Oshi";
          oshi.appendChild(img);
        } else {
          const fallback = document.createElement('div');
          fallback.className = 'avatar-fallback';
          fallback.innerHTML = '💖';
          oshi.appendChild(fallback);
        }

        // EVENT LISTENER KLIK / TAP (ANTI DOUBLE-CLICK BUG)
        oshi.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          handleOshiClick(i, oshi, hole);
        });

        hole.appendChild(oshi);
        stageGrid.appendChild(hole);
      }
    }

    /* ==========================================================================
       LOGIKA KLIK OSHI (+10 SKOR & AUDIO CLONE)
       ========================================================================== */
    function handleOshiClick(index, oshiEl, holeEl) {
      // Validasi: Karakter harus sedang muncul dan belum pernah dipukul
      if (!isPlaying || !oshiEl.classList.contains('up') || oshiEl.dataset.hit === "true") {
        return;
      }

      // 1. Kunci agar tidak bisa di-spam klik
      oshiEl.dataset.hit = "true";

      // 2. Tambah Skor
      score += 10;
      txtScore.textContent = score;

      // 3. Efek Pop Teks Nilai (+10)
      const sparkle = document.createElement('div');
      sparkle.className = 'hit-sparkle';
      sparkle.textContent = '+10';
      holeEl.appendChild(sparkle);
      setTimeout(() => sparkle.remove(), 600);

      // 4. Manajemen Audio SFX (Kloning agar tidak terpotong saat klik cepat)
      if (sfxUrl) {
        const soundClone = sfxPlayer.cloneNode(true);
        soundClone.volume = 0.9;
        soundClone.play().catch(() => {});
      } else {
        playFallbackHitSFX();
      }

      // 5. Langsung turunkan Oshi seketika setelah berhasil ditepuk
      setTimeout(() => {
        oshiEl.classList.remove('up');
        activeHoles.delete(index);
      }, 80);
    }

    /* ==========================================================================
       GAME LOOP & SPAWN OSHI SECARA ACAK
       ========================================================================== */
    function popRandomOshi() {
      if (!isPlaying) return;

      // Cari lubang panggung yang sedang kosong
      const availableIndexes = [];
      for (let i = 0; i < 9; i++) {
        if (!activeHoles.has(i)) availableIndexes.push(i);
      }

      if (availableIndexes.length > 0) {
        const randomIndex = availableIndexes[Math.floor(Math.random() * availableIndexes.length)];
        const holes = document.querySelectorAll('.podium-hole');
        const targetHole = holes[randomIndex];
        const oshiEl = targetHole.querySelector('.oshi-target');

        // Tandai aktif
        activeHoles.add(randomIndex);
        oshiEl.dataset.hit = "false";
        oshiEl.classList.add('up');

        // Durasi Oshi berada di atas panggung (1000ms)
        setTimeout(() => {
          if (oshiEl.classList.contains('up')) {
            oshiEl.classList.remove('up');
            activeHoles.delete(randomIndex);
          }
        }, 1000);
      }

      // Jadwalkan kemunculan berikutnya secara acak (800ms - 1100ms)
      if (isPlaying) {
        const nextSpawnTime = Math.random() * 300 + 800;
        spawnTimer = setTimeout(popRandomOshi, nextSpawnTime);
      }
    }

    /* ==========================================================================
       MULAI GAME & TIMER
       ========================================================================== */
    function startGame() {
      initAudioContext();

      // Reset Variabel
      score = 0;
      timeLeft = 30;
      isPlaying = true;
      activeHoles.clear();

      txtScore.textContent = score;
      txtTimer.textContent = timeLeft;

      // Render Ulang Grid dengan Asset Foto Terbaru
      buildGrid();

      // Transisi Layar
      screenIntro.classList.remove('active');
      modalGameOver.classList.remove('active');
      screenGameplay.classList.add('active');

      // Putar BGM
      if (bgmUrl) {
        bgmPlayer.currentTime = 0;
        bgmPlayer.play().catch(() => {});
      } else {
        startFallbackBgm();
      }

      // Jalankan Timer 30 Detik
      gameTimer = setInterval(() => {
        timeLeft--;
        txtTimer.textContent = timeLeft;

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);

      // Jalankan Spawn Loop Oshi
      popRandomOshi();
    }

    /* ==========================================================================
       SELESAI GAME (CLEANUP & POPUP GAME OVER)
       ========================================================================== */
    function endGame() {
      isPlaying = false;

      // Hentikan Semua Interval & Timer Bersih
      clearInterval(gameTimer);
      clearTimeout(spawnTimer);
      stopFallbackBgm();

      // Hentikan BGM
      bgmPlayer.pause();
      bgmPlayer.currentTime = 0;

      // Turunkan semua oshi
      document.querySelectorAll('.oshi-target').forEach(el => el.classList.remove('up'));

      // Tentukan Predikat Fans Berdasarkan Skor
      let rankMessage = "Fans Pemula";
      if (score >= 250) rankMessage = "👑 Legend Kami-Oshi!";
      else if (score >= 180) rankMessage = "🔥 Senbatsu Chant Leader!";
      else if (score >= 100) rankMessage = "✨ Barisan Depan Theater!";
      else if (score >= 50)  rankMessage = "🎫 Fans Setia!";

      txtFinalScore.textContent = score;
      txtRank.textContent = rankMessage;

      // Tampilkan Pop-Up Glassmorphism Game Over
      modalGameOver.classList.add('active');
    }

    /* ==========================================================================
       RESET & KEMBALI KE MENU UTAMA
       ========================================================================== */
    function resetToMainMenu() {
      modalGameOver.classList.remove('active');
      screenGameplay.classList.remove('active');
      screenIntro.classList.add('active');
    }

    // Pasang Event Tombol
    btnStart.addEventListener('click', startGame);
    btnRestart.addEventListener('click', resetToMainMenu);
  </script>
</body>
</html>
